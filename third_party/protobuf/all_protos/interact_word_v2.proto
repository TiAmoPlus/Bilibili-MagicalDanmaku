syntax = "proto3";

package interact_word_v2;

message InteractWordV2 {

  message FansMedalInfo {
    int64 target_id = 1;
    int64 medal_level = 2;
    string medal_name = 3;
    int64 medal_color = 4;
    int64 medal_color_border = 5;
    int64 medal_color_end = 6;
    int64 medal_color_start = 7;
    int64 is_lighted = 8;
    int64 guard_level = 9;
    string special = 10;
    int64 icon_id = 11;
    int64 anchor_roomid = 12;
    int64 score = 13;
  }
  message ContributionInfo {
    int32 grade = 1;
  }
  message ContributionInfoV2 {
    int64 grade = 1;
    string rank_type = 2;
    string text = 3;
  }
  message GroupMedalBrief {
    int64 medal_id = 1;
    string name = 2;
    int64 is_lighted = 3;
  }

  message UserInfo {
    message Base {
      string name = 1;
      string face = 2;
      string name_color_str = 8;
    }

    message Medal {
      string name = 1;
      int64 level = 2;
      int64 color = 3;
      int64 color_border = 4;
      int64 color_end = 5;
      int64 color_start = 6;
      int64 id = 7;
      int64 is_light = 9;
      int64 target_id = 10;
      int64 guard_level = 11;
      int64 score = 12;
      string guard_icon = 13;
      string v2_medal_color_border = 15;
      string v2_medal_color_end = 16;
      string v2_medal_color_start = 17;
      string v2_medal_color_text = 18;
      string v2_medal_color_level = 19;
    }

    message Wealth {
      int64 level = 1;
    }
    message Title {
      string OldTitleCssId = 1;
      string TitleCssId = 2;
    }
    message Guard {
      int64 level = 1;
      string expired_str = 2;
    }
    message UserHeadFrame {
      int64 id = 1;
      string frame_img = 2;
    }
    message GuardLeader {
      bool is_guard_leader = 1;
    }
    int64 uid = 1;
    Base base = 2;
    Medal medal = 3;
    Wealth wealthy = 4;
    Title title = 5;
    Guard guard = 6;
    UserHeadFrame uhead_frame = 7;
    GuardLeader guard_leader = 8;
  }

  message RelationTail {
    string tail_icon = 1;
    string tail_guide_text = 2;
    int64 tail_type = 3;
  }
  int64 uid = 1;
  string uname = 2;
  string uname_color = 3;
  repeated int64 identities = 4;
  int64 msg_type = 5;
  int64 roomid = 6;
  int64 timestamp = 7;
  int64 score = 8;
  FansMedalInfo fans_medal = 9;
  int64 is_spread = 10;
  string spread_info = 11;
  ContributionInfo contribution = 12;
  string spread_desc = 13;
  int64 tail_icon = 14;
  int64 trigger_time = 15;
  int64 privilege_type = 16;   // privilege_type? 应该就是guard_level 阿b现在这么起名了?
  int64 core_user_type = 17;
  string tail_text = 18;
  ContributionInfoV2 contribution_v2 = 19;
  GroupMedalBrief group_medal = 20;
  bool is_mystery = 21;
  UserInfo uinfo = 22;
  RelationTail relation_tail = 23;
}
